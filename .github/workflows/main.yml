# 工作流名称：1.更新调度（定时+手动触发）
name: '1.Update schedule'

# ⚠️注意：请不要在 fork 的仓库中添加 `on: schedule` 定时任务（cron）。
# Forks 可能被大量复制并触发定时执行，当前 GitHub Actions 资源使用已接近上限，
# 大量 fork 的定时任务可能导致工作流被禁用。若需要定时执行，请使用其它部署方式。
#
# ⚠️NOTICE: Do NOT add `on: schedule` cron triggers in forked repositories.
# Forks may multiply scheduled runs and GitHub Actions resource usage is near limits.
# Many scheduled workflows from forks can cause workflows to be disabled.
# If scheduled execution is required, use other deployment methods.

on:

  schedule:
    # cron 格式：分 时 日 月 周，*/3 表示每3天
    - cron: '55 21 */3 * *'  
  
  workflow_dispatch:  # 允许手动触发（支持在GitHub页面手动点击运行）

jobs:
  push:
    runs-on: ${{ matrix.operating-system }}
    # 关键：赋予工作流读写仓库文件权限，解决git push 403
    permissions:
      contents: write
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
    steps:
      # 1. 判断仓库所有者，设置目标分支
      - name: Set branch name
        id: vars
        run: |
          if [[ "${{ github.repository_owner }}" == "Guovin" ]]; then
            echo "BRANCH_NAME=gd" >> $GITHUB_ENV
          else
            echo "BRANCH_NAME=master" >> $GITHUB_ENV
          fi

      # 2. 拉取完整代码历史，指定分支
      - name: Checkout source code(检出代码)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0 # 获取完整git历史，commit/push必备

      # 3. Python 3.13 环境
      - name: Setup Python 3.13(配置Python 3.13环境)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          update-environment: true

      # 4. 缓存pipenv虚拟环境，加速构建
      - name: Cache Pipenv venv(pipenv虚拟环境，加速构建)
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ env.BRANCH_NAME }}-pipenv-${{ hashFiles('Pipfile,Pipfile.lock') }}

      # 5. 安装系统FFmpeg
      - name: Install FFmpeg(安装FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # 6. 全局安装pipenv，规避--user PATH缺失问题
      - name: Install pipenv(安装pipenv工具)
        run: pip install pipenv

      # 7. 安装项目依赖（修正拼写错误）
      - name: Install dependencies(安装项目依赖)
        run: pipenv --python 3.13 && pipenv install --deploy

      # 8. 执行更新脚本
      - name: Run update task(执行更新命令)
        run: pipenv run dev

      # 9. 提交并推送修改（安全鉴权、指定分支、防冲突）
      - name: Commit and push if changed(提交并推送变更)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 使用action token鉴权远程仓库，解决403无权限
          git remote set-url origin https://x-access-token:${{ github.TOKEN }}@github.com/${{ github.repository }}.git
          # 拉取远端最新代码，避免推送冲突
          git fetch origin ${{ env.BRANCH_NAME }}
          git checkout ${{ env.BRANCH_NAME }}
          git add .
          # 检测是否存在变更
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            # --force-with-lease 比单纯--force安全，远端有新提交不会覆盖
            git push --force-with-lease origin ${{ env.BRANCH_NAME }}
          fi

      # 10. 清理旧的Workflow运行记录（清理冗余运行记录，仅保留最近5条）
      - name: Clear the old Workflow run records(清理旧的Workflow运行记录)
        if: always()  # 无论前面步骤成功与否，都执行清理
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          keep_minimum_runs: 5  # 保留最近5条运行记录
          retain_days: 0        # 不按天数保留，仅按最小运行记录数保留
          ignore_error: true    # 忽略清理过程中的错误，避免影响工作流整体状态
